name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/demo/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build All Packages
        run: bun run build

      - name: Build Docs
        run: cd apps/docs && bun run build

      - name: Prepare Deployment
        run: |
          # Create demo directory in docs dist
          mkdir -p apps/docs/.vitepress/dist/demo
          # Copy demo dist to docs demo folder
          cp -r apps/demo/dist/* apps/docs/.vitepress/dist/demo/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/docs/.vitepress/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
